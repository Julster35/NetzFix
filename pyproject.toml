[project]
name = "netzfix"
version = "0.0.1"
description = "Open-data German transmission grid model: uniform vs zonal vs nodal pricing"
authors = [{ name = "Julien Froidefond" }]
requires-python = ">=3.11"
# Milestone 0 keeps runtime deps minimal. Milestone 1 adds pypsa, linopy, highspy, atlite,
# geopandas, entsoe-py, open-mastr with exact pins (see RESEARCH_PLAN.md).
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netzfix"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
