[project]
name = "netzfix"
version = "0.0.1"
description = "Open-data German transmission grid model: uniform vs zonal vs nodal pricing"
authors = [{ name = "Julien Froidefond" }]
requires-python = ">=3.11"
# open-mastr (AGPL) is deliberately NOT a dependency: see scripts/download_mastr.py.
dependencies = [
    "pyyaml>=6",
    "requests>=2.32",
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "shapely>=2",
    "pypsa==1.4.0",
    "highspy>=1.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "networkx>=3.6.1",
    "cdsapi>=0.7.7",
    "atlite>=0.7.0",
    "pypdf>=6.21.4",
    "openpyxl>=3.1.5",
]

[project.scripts]
netzfix = "netzfix.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netzfix"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
