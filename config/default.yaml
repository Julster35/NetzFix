# NetzFix default configuration.
# Every value here is an ASSUMPTION or a run setting; each is documented in vault/project/Assumptions.md
# (key -> assumption ID). Change values via a scenario file in config/scenarios/, never by editing results.

run:
  name: default
  base_year: 2024          # A1 - demand, capacities, prices of this year
  weather_year: 2024       # A2 - ERA5 weather year for atlite profiles

geography:
  focus_country: DE
  # Neighbours are aggregated (one bus per country). LU is part of the DE-LU bidding zone (A3).
  neighbours: [AT, BE, CH, CZ, DK, FR, LU, NL, NO, PL, SE]

weather:
  # A24 - ERA5 cutout: box = DE land (NUTS3) + MaStR offshore wind units, padded by one ERA5 cell
  module: era5
  margin_deg: 0.25
  features: [wind, influx, temperature]   # what atlite needs for wind and PV capacity factors
  concurrent_requests: false

network:
  source: pypsa-eur-osm    # A4 - PyPSA-Eur base_network: osm (pinned release below)
  pypsa_eur_release: v2026.09.0
  n_clusters_de: 30        # A5 - Milestone 1 smoke size; research runs 50 -> 200+
  s_max_pu: 0.7            # A6 - n-1 security proxy (sensitivities 0.6 / 0.8)
  power_flow: linear_dc    # A7

time:
  resolution: 3h           # A8 - first runs; full hourly year later
  sample: one_week         # one_week | representative_weeks | full_year

markets:
  designs: [A_uniform, B_zonal, C_nodal]
  zone_maps: [DE2_NS, DE5_BZR2025]   # A9 - mapping documented in vault/concepts/Zonal Pricing and Bidding Zones.md
  redispatch_compensation: cost_based  # A10

solver:
  name: highs              # gurobi via override (academic licence)
  options: {}

redispatch:
  # A25 - selection rule of § 13 Abs. 1 S. 2 / Abs. 1a EnWG (v3). min_volume = v0-v2 rule.
  rule: cost_based
  mindestfaktor_ee: 10      # BNetzA Mindestfaktor-Festlegung 2020-11-30, tenor 1
  # TSO-published values, EUR/MWh, valid from 1 Oct (netztransparenz.de "Kalkulatorische Preise",
  # saved 2026-11-04): average cost of conventional up / down (down < 0 = refund), calculated
  # price for curtailing renewables (p_ee) and for grid reserve (p_nr, not used: no reserve units).
  prices:
    - {valid_from: 2023-10-01, c_up: 222.00, c_down: -142.23, p_ee: 575.70, p_nr: 476.50}
    - {valid_from: 2024-10-01, c_up: 181.10, c_down: -130.40, p_ee: 325.8, p_nr: 476.9}
