# NetzFix default configuration.
# Every value here is an ASSUMPTION or a run setting; each is documented in vault/project/Assumptions.md
# (key -> assumption ID). Change values via a scenario file in config/scenarios/, never by editing results.

run:
  name: default
  base_year: 2024          # A1 - demand, capacities, prices of this year
  weather_year: 2024       # A2 - ERA5 weather year for atlite profiles

geography:
  focus_country: DE
  # Neighbours are aggregated (one bus per country). LU is part of the DE-LU bidding zone (A3).
  neighbours: [AT, BE, CH, CZ, DK, FR, LU, NL, NO, PL, SE]

weather:
  # A24 - ERA5 cutout: box = DE land (NUTS3) + MaStR offshore wind units, padded by one ERA5 cell
  module: era5
  margin_deg: 0.25
  features: [wind, influx, temperature]   # what atlite needs for wind and PV capacity factors
  concurrent_requests: false
  # A27 - conversion to capacity factors (atlite 0.7.0 built-in models; a model choice, then the
  # national total is scaled to SMARD every hour, so only the regional shape comes from these)
  wind_onshore_turbine: Vestas_V112_3MW
  wind_offshore_turbine: Vestas_V164_7MW_offshore
  solar_panel: CSi
  solar_orientation: latitude_optimal
  regional_profiles: true
  profile_basis: available      # A28: smard_actual (v5) | available (pre-curtailment, v6)
  # A28 - energy curtailed by redispatch in 2024, GWh ([[SMARD 2025 Netzengpassmanagement 2024]],
  # saved article 2025-04-02): offshore 4,562, onshore 3,384, solar 1,389
  curtailed_gwh_2024: {wind_offshore: 4562, wind_onshore: 3384, solar: 1389}

network:
  source: pypsa-eur-osm    # A4 - PyPSA-Eur base_network: osm (pinned release below)
  pypsa_eur_release: v2026.09.0
  n_clusters_de: 30        # A5 - Milestone 1 smoke size; research runs 50 -> 200+
  s_max_pu: 0.7            # A6 - n-1 security proxy (sensitivities 0.6 / 0.8)
  power_flow: linear_dc    # A7

time:
  resolution: 3h           # A8 - first runs; full hourly year later
  sample: one_week         # one_week | representative_weeks | full_year

markets:
  designs: [A_uniform, B_zonal, C_nodal]
  zone_maps: [DE2_NS, DE5_BZR2025]   # A9 - mapping documented in vault/concepts/Zonal Pricing and Bidding Zones.md
  redispatch_compensation: cost_based  # A10

solver:
  name: highs              # gurobi via override (academic licence)
  options: {}

redispatch:
  # A25 - selection rule of § 13 Abs. 1 S. 2 / Abs. 1a EnWG (v3). min_volume = v0-v2 rule.
  rule: cost_based
  mindestfaktor_ee: 10      # BNetzA Mindestfaktor-Festlegung 2020-11-30, tenor 1
  # TSO-published values, EUR/MWh, valid from 1 Oct (netztransparenz.de "Kalkulatorische Preise",
  # saved 2026-11-04): average cost of conventional up / down (down < 0 = refund), calculated
  # price for curtailing renewables (p_ee) and for grid reserve (p_nr, not used: no reserve units).
  prices:
    - {valid_from: 2023-10-01, c_up: 222.00, c_down: -142.23, p_ee: 575.70, p_nr: 476.50}
    - {valid_from: 2024-10-01, c_up: 181.10, c_down: -130.40, p_ee: 325.8, p_nr: 476.9}

entsoe_units:
  # A26 - replay of 2024 actual output per large thermal unit (ENTSO-E TR 16.1.A, File Library)
  replay: true
  name_min_score: 90         # fallback name match for units without an EIC link
  max_site_km: 30            # drop linked MaStR units this far from the plant's median site
  # A26b - conflict resolution only: control area of a MaStR unit from its federal state (NUTS-1).
  # Used when powerplantmatching attaches one MaStR unit to plants in different control areas.
  tso_by_nuts1:
    DE1: DE_TransnetBW
    DE2: DE_TenneT_GER
    DE3: DE_50HzT
    DE4: DE_50HzT
    DE5: DE_TenneT_GER
    DE6: DE_50HzT
    DE7: DE_TenneT_GER
    DE8: DE_50HzT
    DE9: DE_TenneT_GER
    DEA: DE_Amprion
    DEB: DE_Amprion
    DEC: DE_Amprion
    DED: DE_50HzT
    DEE: DE_50HzT
    DEF: DE_TenneT_GER
    DEG: DE_50HzT

prices:
  # A29 - price layer. `set` chooses the input prices for plant costs:
  #   2024_validation: frozen, from held sources (calibration and the A/B/C comparison of the bet)
  #   latest:          newest values fetched automatically where a free source exists (twin / UI)
  #   user:            hand-set scenario values (labelled as scenario, not data)
  set: 2024_validation
  sets:
    2024_validation:
      # EUA, EUR/t: German auction monthly volume-weighted averages Jan..Dec 2024
      # (DEHSt quarterly reports Q1-Q4 2024, monthly tables; [[DEHSt 2024 Auctioning Reports]])
      co2_eur_t: [61.94, 55.70, 56.60, 64.65, 71.98, 67.67, 66.70, 70.40, 65.13, 63.24, 66.89, 66.66]
      # gas, EUR/MWh_th (Hs): EEX EGSI THE, unweighted 2024 average 34.64; only Jan 30.51 and
      # Dec 45.74 are given monthly (Monitoringbericht 2025, PDF p. 43) -> flat annual value
      gas_eur_mwh_th: 34.64
      # hard coal, EUR/MWh_th: no held source yet (BAFA/Destatis series ended 2023). null = missing
      hard_coal_eur_mwh_th: null
      # lignite, EUR/MWh_th: DIW DD68 p. 90 (2010 value, 10 $/t); no market price exists
      lignite_eur_mwh_th: 2.9
      oil_eur_mwh_th: null
    user: {}

plant_costs:
  # A30 - technology parameters for marginal cost = fuel/eta + CO2 * EF/eta + VOM
  # efficiency eta: DIW DD68 Table 35 (2020 column, PDF p. 89); VOM EUR/MWh_el: DD68 Table 34
  # (2010 EUR, PDF p. 88); emission factor t CO2/TJ: UBA Climate Change 29/2022 Table 23
  # (2020 column, PDF pp. 52-53)
  technologies:
    lignite:            {fuel: lignite,   eta: 0.439, vom: 7.0, ef_t_tj: 110.2}   # BoA; EF Lausitz (Rhineland 113.3, Central 103.6)
    hard_coal_sub:      {fuel: hard_coal, eta: 0.390, vom: 6.0, ef_t_tj: 93.6}
    hard_coal_super:    {fuel: hard_coal, eta: 0.462, vom: 6.0, ef_t_tj: 93.6}
    gas_cc:             {fuel: gas,       eta: 0.605, vom: 4.0, ef_t_tj: 55.8}
    gas_gt:             {fuel: gas,       eta: 0.392, vom: 3.0, ef_t_tj: 55.8}
    gas_st:             {fuel: gas,       eta: 0.412, vom: 3.0, ef_t_tj: 55.8}
    oil:                {fuel: oil,       eta: 0.392, vom: 3.0, ef_t_tj: 79.7}    # oil CT; heavy fuel oil EF

