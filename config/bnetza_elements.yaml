# A36: BNetzA "Überlastete Netzelemente der ÜNB" -> substation chains for matching to model lines.
# Source: data/processed/bnetza_overloaded_elements.csv (src/netzfix/data/bnetza_congestion.py),
# vault/data/BNetzA Overloaded Grid Elements.md. Written 2026-11-06 from the published element
# names only (no model output looked at). The published files lose umlauts (U+FFFD), so each
# element is found by a key that ignores umlauts and the replacement character.
#
# Reading of the names (A36):
# - "A - B - C" and "A-B-C": a chain of consecutive substation pairs (A-B, B-C).
# - "Name (A-B-C, A-D)": the parenthesis lists the chains; the leading name is a label.
# - "A - B/C": two pairs A-B and A-C. "X / Y" with spaces: two separate chains.
# - "A/B" without a dash ("Borken/Gießen"): one pair A-B.
# - Prefixes "Leitung", "Stromkreis", "Gebiet" and suffixes "(PL)", "(DE_PL)", "(FR)" are dropped.
# Elements without named end points are excluded (`chains: []`, reason given).
elements:
  Doerpen:
    names: ["Dörpen (Dörpen-Niederlangen-Meppen-Hanekenfähr)"]
    chains: [[Dörpen, Niederlangen, Meppen, Hanekenfähr]]
  Ovenstaedt-Bechterdissen:
